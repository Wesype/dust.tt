[package]
name = "dfs-fuse"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dfs-mount = { path = "../mount" }
dfs-protocol = { path = "../protocol" }
nix = { version = "0.30", features = ["fs", "user"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }

# Builds and tests the adapter on macOS without macFUSE. Mounting fails there.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18", default-features = false, features = ["macos-no-mount"] }

# The mount test runs only on Linux, against a dfs server backed by FoundationDB.
[target.'cfg(target_os = "linux")'.dev-dependencies]
dfs-api = { path = "../server" }
foundationdb = { version = "=0.11.0", default-features = false, features = ["fdb-7_4", "embedded-fdb-include"] }
nix = { version = "0.30", features = ["signal"] }
tokio = { version = "1", features = ["net"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
